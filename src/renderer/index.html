<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Ritesh Roshan">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:">
<title>Music Notch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="halo" id="halo" aria-hidden="true"></canvas>
<div class="bar" id="bar">
  <div class="island idle" role="button" tabindex="0" id="np" aria-expanded="false" aria-label="Now playing">
    <canvas class="bloom" id="bloom" aria-hidden="true"></canvas>

    <div class="layer chip">
      <span class="art sm" id="artSm"></span>
      <span class="line" id="chipLine"><span class="txt" id="chipText"></span></span>
      <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="layer full">
      <div class="head">
        <span class="art lg" id="artLg"></span>
        <div class="meta"><b id="title"></b><span id="artist"></span></div>
        <span class="round" role="button" tabindex="0" id="lyricsBtn" aria-pressed="true" aria-label="Synced lyrics" title="Synced lyrics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h11M4 17.5h7"/><circle cx="18.5" cy="17" r="2.2"/><path d="M20.7 17V10.5"/></svg>
        </span>
      </div>
      <div class="lyrics" id="lyrics" aria-live="polite"><p class="now" id="lyNow"></p><p class="next" id="lyNext"></p></div>
      <div class="controls">
        <span class="ctl" role="button" tabindex="0" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="3" height="15" rx="1"/><path d="M20 5.4v13.2a1 1 0 0 1-1.53.85L8.3 13.1a1.3 1.3 0 0 1 0-2.2l10.17-6.35A1 1 0 0 1 20 5.4Z"/></svg></span>
        <span class="ctl play" role="button" tabindex="0" id="play" aria-label="Pause"><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="3.5" width="4.4" height="17" rx="1.4"/><rect x="14.1" y="3.5" width="4.4" height="17" rx="1.4"/></svg><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.7v14.6a1.3 1.3 0 0 0 2 1.1l11.4-7.3a1.3 1.3 0 0 0 0-2.2L8.5 3.6a1.3 1.3 0 0 0-2 1.1Z"/></svg></span>
        <span class="ctl" role="button" tabindex="0" id="next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="17" y="4.5" width="3" height="15" rx="1"/><path d="M4 5.4v13.2a1 1 0 0 0 1.53.85l10.17-6.35a1.3 1.3 0 0 0 0-2.2L5.53 4.55A1 1 0 0 0 4 5.4Z"/></svg></span>
      </div>
      <div class="progress">
        <span class="tnum" id="tNow">0:00</span>
        <div class="track" id="track" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
        <span class="tnum" id="tEnd">0:00</span>
      </div>
      <div class="grab" id="grab" role="button" tabindex="0" aria-label="Close"></div>
    </div>
  </div>
</div>
<script src="sound.js"></script>
<script src="motion.js"></script>
<script src="ears.js"></script>
<script src="aurora.js"></script>
<script src="app.js"></script>
</body>
</html>
