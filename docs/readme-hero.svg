<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="560" rx="28" fill="#ffffff"/>
  <!-- the ghost: a huge grey word breathing behind everything -->
  <text x="600" y="470" text-anchor="middle" font-size="330" font-weight="800" letter-spacing="-20" fill="#0d1117" fill-opacity="0.06">notch
    <animate attributeName="fill-opacity" values="0.05;0.085;0.05" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- the island: shoulders, bubble, face -->
  <g>
    <path d="M534 0 h132 v20 a26 26 0 0 1 -26 26 h-80 a26 26 0 0 1 -26 -26 z" fill="#000"/>
    <path d="M506 0 h28 v14 a14 14 0 0 0 -14 -14 z M694 0 h-28 v14 a14 14 0 0 1 14 -14 z" fill="#000"/>
    <g transform="translate(600 23)">
      <ellipse cx="-12" cy="-1" rx="5.5" ry="6.5" fill="#fff">
        <animate attributeName="ry" values="6.5;6.5;0.8;6.5;6.5" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="12" cy="-1" rx="5.5" ry="6.5" fill="#fff">
        <animate attributeName="ry" values="6.5;6.5;0.8;6.5;6.5" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M-3.5 9 q3.5 3.5 7 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
  <!-- words: as few as possible -->
  <text x="600" y="250" text-anchor="middle" font-size="96" font-weight="800" letter-spacing="-5" fill="#0d1117">Music Notch</text>
  <text x="600" y="306" text-anchor="middle" font-size="26" font-weight="500" fill="#0d1117" fill-opacity="0.55">Your music, on top.</text>
</svg>
